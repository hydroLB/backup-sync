[package]
name = "backup_core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono"] }
tracing-appender = "0.2"
dirs = "5"
notify = "6"
walkdir = "2"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "signal", "time"] }
parking_lot = "0.12"
fs2 = "0.4"
globset = "0.4"
tempfile = "3"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "core_hot_paths"
harness = false
