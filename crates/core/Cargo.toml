[package]
name = "backup_core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
bench = ["dep:criterion"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono", "json"] }
tracing-appender = "0.2"
dirs = "5"
notify = "6"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "signal", "time"] }
parking_lot = "0.12"
fs2 = "0.4"
globset = "0.4"
tempfile = "3"
sha2 = "0.10"
filetime = "0.2"
chacha20poly1305 = { version = "0.10", features = ["std", "stream"] }
zstd = "0.13"
criterion = { version = "0.5", optional = true }

[[bench]]
name = "core_hot_paths"
harness = false
required-features = ["bench"]
