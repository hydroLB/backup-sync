[package]
name = "gui"
version = "0.1.0"
edition = "2021"

[features]
default = []
single-instance = ["dep:tauri-plugin-single-instance"]

[dependencies]
backup_core = { path = "../core" }
daemon = { path = "../daemon" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tauri = { version = "1", features = ["dialog-all", "path-all", "system-tray"] }
tracing = "0.1"
once_cell = "1"
dirs = "5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
tauri-plugin-single-instance = { path = "../tauri-plugin-single-instance", optional = true }

[build-dependencies]
tauri-build = { version = "1", features = [] }
