[package]
name = "gui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
single-instance = ["dep:tauri-plugin-single-instance"]

[dependencies]
backup_core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tauri = { version = "2", features = ["tray-icon"] }
tracing = "0.1"
once_cell = "1"
dirs = "6"
zip = { version = "8.4", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
tauri-plugin-single-instance = { version = "2.4.0", optional = true }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
