[package]
name = "daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
backup_core = { path = "../core" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "net", "sync", "time", "io-util"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
dirs = "5"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "io-util"] }
tempfile = "3"
