changelog:
  categories:
    - title: Breaking Changes
      labels:
        - breaking
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Security
      labels:
        - security
    - title: Performance
      labels:
        - perf
    - title: Documentation
      labels:
        - docs
    - title: Maintenance
      labels:
        - chore
        - maintenance
  exclude:
    labels:
      - skip-changelog
