name: Bug Report
description: Report a reproducible defect.
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear description of the defect and impact.
      placeholder: What is broken and why it matters.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Exact deterministic steps to reproduce.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or Commit
      placeholder: main@<short-sha> or release tag
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Evidence
      description: Paste relevant logs, stack traces, or screenshots. Remove secrets.
