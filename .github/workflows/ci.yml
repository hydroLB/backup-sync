name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache

jobs:
  format:
    name: ci-format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch tip
        with:
          toolchain: 1.93.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Cache cargo + npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-format-rust-1.93.0-${{ hashFiles('Cargo.lock', 'crates/gui/frontend/package-lock.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-format-rust-1.93.0-

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Rust format check
        run: make fmt-check

      - name: Frontend format check
        run: make frontend-format-check

  lint:
    name: ci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install Tauri Linux prerequisites
        run: ./scripts/ci/install-tauri-linux-deps.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch tip
        with:
          toolchain: 1.93.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Cache cargo + npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-lint-rust-1.93.0-${{ hashFiles('Cargo.lock', 'crates/gui/frontend/package-lock.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lint-rust-1.93.0-

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Rust lint
        run: make clippy

      - name: Frontend lint
        run: make frontend-lint

      - name: Layer boundary check
        run: make boundaries-check

      - name: Operability policy check
        run: make operability-check

      - name: Hygiene check
        run: make hygiene-check

      - name: Documentation check
        run: make docs-check

  typecheck:
    name: ci-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install Tauri Linux prerequisites
        run: ./scripts/ci/install-tauri-linux-deps.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch tip
        with:
          toolchain: 1.93.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Cache cargo + npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-typecheck-rust-1.93.0-${{ hashFiles('Cargo.lock', 'crates/gui/frontend/package-lock.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-typecheck-rust-1.93.0-

      - name: Rust typecheck
        run: cargo check --workspace --all-targets

      - name: Rust API documentation check
        run: make rustdoc-check

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Frontend typecheck
        run: make frontend-typecheck

  tests:
    name: ci-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install Tauri Linux prerequisites
        run: ./scripts/ci/install-tauri-linux-deps.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch tip
        with:
          toolchain: 1.93.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Cache cargo + npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-tests-rust-1.93.0-${{ hashFiles('Cargo.lock', 'crates/gui/frontend/package-lock.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-tests-rust-1.93.0-

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Prepare test reports
        run: mkdir -p .reports/tests

      - name: Run backend tests
        run: |
          set -o pipefail
          make test 2>&1 | tee .reports/tests/backend-tests.log

      - name: Run frontend tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          make frontend-test 2>&1 | tee .reports/tests/frontend-tests.log

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-tests-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .reports/tests/backend-tests.log
            .reports/tests/frontend-tests.log

  coverage:
    name: ci-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch tip
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Cache cargo + npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-coverage-rust-1.93.0-${{ hashFiles('Cargo.lock', 'crates/gui/frontend/package-lock.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-coverage-rust-1.93.0-

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Run coverage gates
        run: |
          mkdir -p .reports/coverage
          set -o pipefail
          make coverage 2>&1 | tee .reports/coverage/coverage.log

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .reports/coverage/coverage.log
            crates/gui/frontend/coverage

  perf:
    name: ci-perf
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch tip
        with:
          toolchain: 1.93.0

      - name: Cache Cargo inputs and perf outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-perf-rust-1.93.0-${{ hashFiles('Cargo.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-perf-rust-1.93.0-

      - name: Run perf guard
        run: |
          mkdir -p .reports/perf
          set -o pipefail
          make perf-check 2>&1 | tee .reports/perf/perf.log

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-perf-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: .reports/perf/perf.log

  build:
    name: ci-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install Tauri Linux prerequisites
        run: ./scripts/ci/install-tauri-linux-deps.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch tip
        with:
          toolchain: 1.93.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Cache cargo + npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-build-rust-1.93.0-${{ hashFiles('Cargo.lock', 'crates/gui/frontend/package-lock.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-rust-1.93.0-

      - name: Build workspace and frontend bundle
        run: make build

  platform-compile:
    name: ci-platform-compile-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
          - platform: windows
            os: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch tip
        with:
          toolchain: 1.93.0

      - name: Cache Cargo inputs and compile outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-platform-rust-1.93.0-${{ hashFiles('Cargo.lock') }}-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-platform-rust-1.93.0-

      - name: Compile-check complete workspace (no packaging)
        run: cargo check --workspace --all-targets --all-features --locked

  security:
    name: ci-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        with:
          fail: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable branch tip
        with:
          toolchain: 1.93.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Cache cargo + npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-security-rust-1.93.0-${{ hashFiles('Cargo.lock', 'crates/gui/frontend/package-lock.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-security-rust-1.93.0-

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Lockfile hygiene check
        run: make lockfile-check

      - name: Cargo deny policy check
        run: make deny

      - name: Dependency audit
        run: make audit

  ci-canonical:
    name: ci-canonical-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - format
      - lint
      - typecheck
      - tests
      - coverage
      - perf
      - build
      - platform-compile
      - security
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Validate canonical command contract
        run: ./scripts/tests/ci-contract-smoke.sh .reports/ci/ci-contract.txt

      - name: Validate release permission contract
        run: ./scripts/tests/release-permissions-smoke.sh

      - name: Upload CI contract artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-contract-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: .reports/ci/ci-contract.txt
