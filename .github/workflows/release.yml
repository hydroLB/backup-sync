name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate:
    name: release-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Validate SemVer tag
        run: ./scripts/release/validate_semver_tag.sh "${GITHUB_REF_NAME}"

      - name: Validate changelog entry for tagged version
        run: ./scripts/release/validate_changelog_for_release.sh "${GITHUB_REF_NAME#v}" CHANGELOG.md

  publish:
    name: release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate
    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Backup Sync ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
