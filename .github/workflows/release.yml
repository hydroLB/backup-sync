name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: release-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Fetch main for ancestry validation
        run: git fetch origin main --force

      - name: Validate release ref policy
        run: ./scripts/release/validate_release_ref.sh "${GITHUB_REF_NAME}" "origin/main"

      - name: Validate SemVer tag
        run: ./scripts/release/validate_semver_tag.sh "${GITHUB_REF_NAME}"

      - name: Validate changelog entry for tagged version
        run: ./scripts/release/validate_changelog_for_release.sh "${GITHUB_REF_NAME#v}" CHANGELOG.md

      - name: Validate release workflow permissions
        run: ./scripts/tests/release-permissions-smoke.sh

  publish:
    name: release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Backup Sync ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
