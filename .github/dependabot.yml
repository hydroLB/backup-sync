version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    target-branch: main
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust

  - package-ecosystem: npm
    directory: "/crates/gui/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/New_York
    target-branch: main
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
