version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: America/New_York
    target-branch: main
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      rust-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - rust

  - package-ecosystem: npm
    directory: "/crates/gui/frontend"
    schedule:
      interval: monthly
      day: monday
      time: "06:15"
      timezone: America/New_York
    target-branch: main
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - frontend

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:30"
      timezone: America/New_York
    target-branch: main
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    labels:
      - dependencies
      - github-actions
